name: Feature or policy request
description: Suggest a new capability, improvement, configuration policy, or integration.
title: "[Request]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing an idea that could help partners and administrators deploy security configurations more consistently.

        Keep examples generic. Do not include customer information, tenant IDs, credentials, tokens, certificates, or sensitive logs.
  - type: dropdown
    id: request-category
    attributes:
      label: Request category
      description: Select the type of request.
      options:
        - New configuration template
        - New security policy
        - New PowerShell automation
        - New validation check
        - Improvement to existing content
        - Additional license-level support
        - Integration request
        - Other
    validations:
      required: true
  - type: dropdown
    id: solution-area
    attributes:
      label: Microsoft solution area
      description: Select the primary area for this request.
      options:
        - Microsoft Defender for Endpoint
        - Microsoft Defender for Office 365
        - Microsoft Defender for Identity
        - Microsoft Defender for Cloud Apps
        - Microsoft Intune
        - Microsoft Purview
        - Microsoft Entra
        - PowerShell or Microsoft Graph
        - Documentation
        - Deployment tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: business-problem
    attributes:
      label: Business or customer problem
      description: Describe the general problem without identifying a customer or tenant.
      placeholder: "Example: Partners need a repeatable way to verify that a baseline policy was assigned successfully."
    validations:
      required: true
  - type: textarea
    id: proposed-capability
    attributes:
      label: Proposed capability or policy
      description: Explain the behavior, template, automation, or policy you would like added or changed.
      placeholder: "Example: Add a validation script that confirms required Intune policy assignments."
    validations:
      required: true
  - type: input
    id: intended-users
    attributes:
      label: Intended users
      description: Identify who would use this, such as partners, security consultants, or administrators.
      placeholder: "Example: Microsoft partners deploying a standard Intune security baseline"
    validations:
      required: true
  - type: input
    id: license-dependency
    attributes:
      label: Required Microsoft license or dependency
      description: Enter known licensing, roles, permissions, or technical dependencies, if any.
      placeholder: "Example: Microsoft 365 E5 and Microsoft Graph Policy.Read.All, if known"
  - type: textarea
    id: example-use-case
    attributes:
      label: Example use case
      description: Provide a realistic, sanitized example of how the request would be used.
      placeholder: "Example: Before handover, a consultant runs the validation to confirm all required policies are assigned."
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected outcome
      description: Describe the result or benefit that would make this request successful.
      placeholder: "Example: A clear pass or fail result that identifies missing assignments."
    validations:
      required: true
  - type: textarea
    id: conflicts-security-considerations
    attributes:
      label: Potential conflicts or security considerations
      description: Note possible policy conflicts, permissions, scope concerns, or security effects. Write "None known" if none are known.
      placeholder: "Example: The automation should use least-privilege permissions and avoid changing unrelated policies."
    validations:
      required: true
  - type: dropdown
    id: contribution-interest
    attributes:
      label: Willingness to help test or contribute
      description: Let maintainers know how you can help.
      options:
        - I can test in a sanitized test tenant
        - I can contribute documentation or examples
        - I can contribute code or validation
        - I can provide feedback only
    validations:
      required: true
  - type: checkboxes
    id: sensitive-data-confirmation
    attributes:
      label: Sensitive data confirmation
      options:
        - label: This request contains no credentials, secrets, customer information, tenant identifiers, access tokens, certificates, or sensitive logs.
          required: true
  - type: checkboxes
    id: existing-issues-confirmation
    attributes:
      label: Existing issues confirmation
      options:
        - label: I reviewed existing issues and did not find a matching request.
          required: true
